version: '3'

vars:
  BINARY: go-scaffolder
  ROOT_DIR:
    sh: pwd

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build the scaffolder binary
    cmds:
      - mkdir -p bin
      - go build -ldflags "-X main.version=dev" -o bin/{{.BINARY}} .

  test:
    desc: Run unit and property tests
    cmds:
      - GOMODCACHE={{.ROOT_DIR}}/.modcache GOCACHE={{.ROOT_DIR}}/.cache/go-build GOSUMDB=off go test ./internal/... -count=1

  test-integration:
    desc: Run integration tests (scaffolds real projects and compiles them)
    cmds:
      - GOMODCACHE={{.ROOT_DIR}}/.modcache GOCACHE={{.ROOT_DIR}}/.cache/go-build GOSUMDB=off go test -tags integration ./tests/ -count=1 -timeout 300s

  test-all:
    desc: Run all tests (unit + integration)
    cmds:
      - GOMODCACHE={{.ROOT_DIR}}/.modcache GOCACHE={{.ROOT_DIR}}/.cache/go-build GOSUMDB=off go test -tags integration ./... -count=1 -timeout 300s

  test-verbose:
    desc: Run all tests with verbose output
    cmds:
      - GOMODCACHE={{.ROOT_DIR}}/.modcache GOCACHE={{.ROOT_DIR}}/.cache/go-build GOSUMDB=off go test -tags integration ./... -v -count=1 -timeout 300s

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  check:
    desc: Full CI gate — vet + lint + unit tests with race detector
    cmds:
      - task: vet
      - task: lint
      - task: test-all

  release:
    desc: 'Create a version tag and push it (usage: task release -- v0.1.0)'
    deps: [check, build]
    preconditions:
      - sh: 'test -n "{{.CLI_ARGS}}"'
        msg: 'version tag required (e.g. task release -- v0.1.0)'
      - sh: 'git diff --quiet'
        msg: 'working tree has uncommitted changes'
    cmds:
      - git tag -a "{{.CLI_ARGS}}" -m "Release {{.CLI_ARGS}}"
      - git push origin {{.CLI_ARGS}}
      - echo "Tagged and pushed {{.CLI_ARGS}}"

  release-local:
    desc: Test goreleaser locally (snapshot, no publish)
    cmds:
      - goreleaser release --snapshot --clean

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin
